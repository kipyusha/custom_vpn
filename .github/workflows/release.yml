name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история и теги нужны для автогенерации списка изменений.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: npm ci

      # Если есть release-notes/<tag>.md, он становится описанием релиза.
      # Иначе список изменений собирается из коммитов между тегами.
      - name: Build release notes
        id: notes
        run: |
          $current = "${{ github.ref_name }}"
          $notesFile = "release-notes/$current.md"
          if (Test-Path $notesFile) {
            $body = Get-Content $notesFile -Raw
          } else {
            $prev = git tag --sort=-creatordate | Where-Object { $_ -ne $current } | Select-Object -First 1
            if ($prev) {
              $log = git log --pretty=format:'- %s' "$prev..$current"
            } else {
              $log = git log --pretty=format:'- %s' -10 $current
            }
            $log = $log | Where-Object { $_ -notmatch '^- Версия ' -and $_ -notmatch '^- Merge ' }
            $body = "## Что нового`n`n" + ($log -join "`n")
          }
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # Сборка Tauri, подпись обновлений и публикация черновика релиза.
      # Релиз создаётся как Draft: проверь файлы, потом нажми Publish.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CustomVPN ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true

      # Портабл-архив для тех, кто не пользуется установщиком.
      - name: Build portable zip
        run: powershell -ExecutionPolicy Bypass -File packaging/package-portable.ps1

      - name: Attach portable zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: CustomVPN-Portable.zip
